[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-tracking"
version = "0.1.0"
description = "SENTRY: neighbor-aware temporal rescue for SAM2-based tracking"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Mohamad Alansari" },
    { name = "Yonathan Michael" },
    { name = "Hasan AlMarzouqi" },
    { name = "Muzammal Naseer" },
    { name = "Naoufel Werghi" },
    { name = "Sajid Javed" },
]
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "loguru>=0.7",
    "matplotlib>=3.7",
    "numpy>=1.24.4",
    "opencv-python>=4.8",
    "Pillow>=9.4",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.66.1",
]

[project.optional-dependencies]
evaluation = [
    "vot-toolkit>=0.7.4",
    "vot-trax>=4.0.2",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://hamadya.github.io/SENTRY/page/"
Paper = "https://arxiv.org/abs/2606.24449"
Repository = "https://github.com/HamadYA/SENTRY"

[project.scripts]
sentry-run = "sentry_tracking.cli:main"

[tool.setuptools]
license-files = [
    "LICENSE",
    "NOTICE",
    "LICENSE_cctorch",
    "THIRD_PARTY_LICENSES/*.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
